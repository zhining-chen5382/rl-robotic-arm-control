    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(526.176 260.653794)">Clip joints; recompute kinematic FK</text>
   </g>
   <g id="text_5">
    <text style="fill:#087f83;font-family:DejaVu Sans;font-size:15px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 526.176, 355.861496)" x="526.176" y="355.861496">03  Rollout and candidate</text>
   </g>
   <g id="text_6">
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(526.176 378.809812)">Store states + collision history</text>
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(526.176 397.146203)">Keep the best pose candidate</text>
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(526.176 415.482594)">Budget: up to 150 PPO steps</text>
   </g>
   <g id="text_7">
