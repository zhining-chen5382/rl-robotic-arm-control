    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(79.056 571.328603)">Pose / collision / latency metrics</text>
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(79.056 589.664994)">Experiment JSON and metrics CSV</text>
