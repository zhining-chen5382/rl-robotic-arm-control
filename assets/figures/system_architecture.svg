  </g>
  <g id="text_18">
   <text style="fill:#53687b;font-family:DejaVu Sans;font-size:13.5px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 40.5, 122.901891)" x="40.5" y="122.901891">v30 runtime: 58 inputs, 8 actions. Joint-position updates use kinematic FK and SDF.</text>
  </g>
  <g id="text_19">
   <text style="fill:#53687b;font-family:DejaVu Sans;font-size:13px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 40.5, 676.62)" x="40.5" y="676.62">Separate research branches: PointNet-PPO and seven-action frozen-base Residual PPO.</text>
  </g>
  <g id="text_20">
