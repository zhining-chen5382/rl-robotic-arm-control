   </g>
   <g id="text_3">
    <text style="fill:#087f83;font-family:DejaVu Sans;font-size:15px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 526.176, 201.032696)" x="526.176" y="201.032696">02  PPO joint update</text>
   </g>
   <g id="text_4">
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(526.176 223.981013)">Direction + learned step magnitude</text>
