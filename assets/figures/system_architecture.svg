    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(79.056 397.146203)">Final pose + rollout + any DLS path</text>
    <text style="fill:#18334d;font-family:DejaVu Sans;font-size:14px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(79.056 415.482594)">Compute pose errors and outcome</text>
   </g>
