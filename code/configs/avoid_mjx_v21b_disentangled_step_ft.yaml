# v21b: corrected direction/step decomposition.
# The first seven outputs are max-abs normalized, so only output 8 controls
# global action magnitude. Broad initial speed exploration makes slowdown
# discoverable while deterministic initialization remains full-speed.
reward:
  task_base: 2.006
  task_scale: 1000.0
  task_diff: true
  w_progress: 10.0
  w_safe: 2.0
  w_collision: 200.0
  w_joint_limit: 1.0
  w_smooth: 0.05
  step_penalty: 0.0005
  success_reward: 100.0
  w_orient_progress: 5.0
env:
  robot_id: panda
  max_steps: 100
  pos_tolerance: 0.005
  orient_tolerance_deg: 3.0
  safe_margin: 0.1
  success_margin: 0.015
  min_action_scale: 0.003
  max_action_span: 0.49
  learned_step_scale: true
  learned_step_min: 0.10
  normalize_joint_direction: true
  orient_scale_weight: 0.5
  brake_margin: 0.35
  brake_floor: 0.05
  brake_mode: per_joint
  obs_obstacle_hint: false
  obs_safe_joint_dir: false
  obs_count_hint: false
  dist_clip: 0.5
  target_margin: 0.15
  start_random_prob: 0.5
  monitored_links: [0, 1, 2, 3, 4, 5, 6, 8, 9, 10]
  gui: false
obstacle:
  shapes: [box, sphere, cylinder]
  box_half_extents: [0.02, 0.1]
  sphere_radius: [0.03, 0.1]
  cylinder_radius: [0.02, 0.07]
  cylinder_height: [0.1, 0.4]
  target_clearance: 0.12
  start_clearance: 0.05
  query_range: 1.0
  max_attempts: 80
  color: [0.85, 0.3, 0.25, 0.85]
  region_x: [-0.2, 0.75]
  region_y: [-0.65, 0.65]
  region_z: [0.08, 0.95]
  stages:
  - name: no-obstacle-eval-baseline
    threshold: 0.0
    n_min: 0
    n_max: 0
  - name: v17-hard-scene-mix
    threshold: 0.0
    n_min: 0
    n_max: 3
    n_weights: [0.20, 0.15, 0.30, 0.35]
    dist_min: 0.1
    dist_max: 0.35
    clearance: 0.05
train:
  model_name: panda_ppo_ik_avoid_v21b_disentangled_step_ft
  timesteps: 3000000
  n_envs: 48
  learning_rate: 3.0e-05
  lr_final: 5.0e-06
  n_steps: 2048
  batch_size: 1024
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  extra_action_init: 1.0
  extra_action_log_std: -0.5
  net_arch: [512, 512, 256, 128]
  eval_freq_steps: 500000
  n_eval_episodes: 200
  checkpoint_freq_steps: 500000
  clip_reward: 20.0
  spot_eval_n: 1000
  spot_eval_freq_steps: 2500000
